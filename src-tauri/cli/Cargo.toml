[package]
name = "scriptbutler-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for ScriptButler"

[[bin]]
name = "sbctl"
path = "src/main.rs"

[dependencies]
scriptbutler-core = { path = "../core" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
