name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            rust-targets: ''
          - name: windows-x86_64
            platform: windows-latest
            args: '--bundles nsis'
            rust-targets: ''
          - name: macos-aarch64
            platform: macos-latest
            args: '--bundles dmg --target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - name: macos-x86_64
            platform: macos-latest
            args: '--bundles dmg --target x86_64-apple-darwin'
            rust-targets: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI sidecar
        run: node scripts/build-cli.mjs ${{ matrix.rust-targets }}

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ScriptButler v__VERSION__
          releaseBody: |
            Download the installer for your platform below.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
